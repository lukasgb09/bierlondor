<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bierlond'Or Abstimmung 2026</title>
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: ein Schritt pro Bildschirm, Pokal auf der Startseite, kleines Pokal-Logo als Muster im Hintergrund. Dunkel mit Stahlblau und Gold. */
:root{
  --bg:#0f1216; --panel:#181d24; --line:#2b323c; --fg:#eef0f2; --muted:#8f99a6;
  --steel:#6f8092; --gold:#e3ab28; --gold-hi:#f4c85a; --ink:#1a1203; --warn:#f08a64; --ok:#86c982;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.14}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 38%,rgba(227,171,40,.10),transparent 70%)}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px;height:44px;max-width:560px;width:100%;margin:0 auto}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;transition:opacity .3s}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .45s ease}
.top[data-hide="1"] .bar{opacity:0}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(24,29,36,.7);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.gear:hover{color:var(--gold);border-color:var(--gold)}
.gear svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#stage{flex:1;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding-block:12px}
.step{display:flex;flex-direction:column;gap:18px;animation:in .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h2{font-size:clamp(38px,11vw,56px)}
.lead{color:var(--muted);margin:0}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.intro h1{font-size:clamp(44px,12.5vw,92px);letter-spacing:0}
.intro .sub{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,30px);letter-spacing:.34em;text-indent:.34em;color:var(--gold)}
.pokalbtn{display:block;background:none;border:0;padding:0;margin:6px 0 0;cursor:pointer;perspective:700px;animation:float 5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.pokal{display:block;width:auto;max-width:min(78vw,300px);height:min(42vh,380px);object-fit:contain;pointer-events:none}
.pokal.spin{animation:spin .95s cubic-bezier(.25,.7,.2,1)}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{0%{transform:rotateY(0) scale(1)}45%{transform:rotateY(200deg) scale(1.12)}100%{transform:rotateY(360deg) scale(1)}}
.pokaltxt{min-height:1.5em;margin:0;color:var(--gold);font-weight:600;font-size:15px;transition:opacity .3s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.btn{font:800 22px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:15px 26px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;min-width:200px;transition:transform .15s,background .15s}
.btn:hover{background:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%}
.ghost{background:none;border:0;color:var(--muted);font:600 15px var(--body);padding:10px 4px;cursor:pointer}
.ghost:hover{color:var(--fg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.nav .btn{flex:1;max-width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{padding:28px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:800 28px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--gold)}
.big:active{transform:scale(.98)}
.big[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=search],select,input[type=password]{width:100%;font:500 17px var(--body);padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.small{font-size:13px;color:var(--muted);margin:0}
.msg{margin:0;color:var(--warn);font-size:14px;min-height:1.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 16px var(--body);cursor:pointer;text-align:center;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--steel)}
.opt[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.search{-webkit-appearance:none;appearance:none}
.tile{position:relative;aspect-ratio:25/30;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,opacity .15s;display:block;width:100%}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile:hover{border-color:var(--steel)}
.tile:active{transform:scale(.98)}
.tile .chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font:800 16px/28px var(--body);text-align:center;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.tile[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tile[aria-pressed="true"] .chk{opacity:1;transform:none}
.tile.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--fg);font:700 16px var(--body);text-align:center;padding:10px}
.tile.ph b{font:900 56px/1 var(--display);color:var(--gold)}
.tile.ph span:not(.chk){overflow-wrap:anywhere}
.qlist{display:flex;flex-direction:column;gap:10px}
.quote{position:relative;text-align:left;width:100%;padding:14px 48px 14px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:500 16px/1.4 var(--body);cursor:pointer;transition:border-color .15s,transform .15s}
.quote:hover{border-color:var(--steel)}
.quote:active{transform:scale(.99)}
.quote .qm{display:block;margin:0 0 6px}
.quote .qm:last-of-type{margin-bottom:0}
.quote .qm b{color:var(--gold);font-weight:800}
.quote .qd{display:block;margin-top:10px;font-size:12px;opacity:.65}
.quote .chk{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font:800 16px/28px var(--body);text-align:center;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.quote[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.quote[aria-pressed="true"] .chk{opacity:1;transform:none}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.sum button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:500 16px var(--body);cursor:pointer}
.sum button:last-child{border-bottom:0}
.sum button:hover{background:rgba(255,255,255,.03)}
.sum span:first-child{color:var(--muted);font-size:13px}
.sum b{font-weight:700;text-align:right;overflow-wrap:anywhere}
.done{align-items:center;text-align:center}
.done .logo{width:90px;height:auto}
.h2row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h2row h2{margin:0}
.infobtn{flex:none;width:34px;height:34px;margin-top:6px;border-radius:50%;border:2px solid var(--gold);background:none;color:var(--gold);font:italic 800 17px/1 Georgia,serif;cursor:pointer}
.infobtn:hover{background:rgba(227,171,40,.15)}
.imodal{position:fixed;inset:0;z-index:30;background:rgba(10,12,15,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:ifade .25s ease both}
.icard{width:100%;max-width:420px;background:var(--bg);border:2px solid var(--gold);border-radius:18px;padding:24px 20px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:ipop .4s cubic-bezier(.2,.9,.3,1.2) both}
.icard .logo{width:64px;height:auto}
.icard h3{margin:0;font:900 28px/1.1 var(--display);text-transform:uppercase}
.icard p{margin:0 0 6px;font:500 16px/1.5 var(--body);color:var(--muted)}
@keyframes ifade{from{opacity:0}to{opacity:1}}
@keyframes ipop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.imodal,.icard{animation:none}}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,15,.88);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet{width:100%;max-width:640px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:6vh;display:flex;flex-direction:column;gap:14px}
.sheet.wide{margin-top:0}
.sheet h3{font:900 30px var(--display);text-transform:uppercase;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:900 36px var(--display);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px}
.chips button{flex:1;padding:9px 6px;border:2px solid var(--line);border-radius:10px;background:none;color:var(--fg);font:700 14px var(--body);cursor:pointer}
.chips button.on{border-color:var(--gold);background:rgba(227,171,40,.12);color:var(--gold)}
.res.win{border-color:var(--gold)}
.wrow{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.wrow small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wrow b{font:800 20px var(--body);color:var(--gold)}
.wrow span{font-size:13px;color:var(--muted)}
.wrow em{font-style:normal;color:#ff8a7a;font-weight:700}
.arow{display:flex;gap:8px;margin-top:12px}.arow button{flex:1}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.res h4{margin:0 0 6px;font:800 22px var(--display);text-transform:uppercase}
.tally{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin:8px 0;font-variant-numeric:tabular-nums}
.tally .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tally .b i{display:block;height:100%;background:var(--gold)}
.tally.top span:first-child{font-weight:700}
.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dup{color:var(--warn);font-weight:700}
.del{font:600 13px var(--body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--warn);cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(227,171,40,.15);color:var(--gold)}
[hidden]{display:none!important}
.evt{margin:0;text-align:center;font:600 14px var(--body);color:var(--gold);opacity:.9}
.endcard{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;margin-top:10px;padding:16px;border:2px solid var(--gold);border-radius:14px;background:var(--panel);animation:in .6s .3s cubic-bezier(.2,.7,.2,1) both}
.endcard b{font:900 24px/1.1 var(--display);text-transform:uppercase}
.endcard span{font:500 15px/1.4 var(--body)}
.endcard .gw{margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.endcard .gw i{font-style:normal;font-weight:800;color:var(--gold);margin-right:4px}
.onb{display:flex;flex-direction:column;gap:14px;padding-top:6vh}
.ob-art{height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.ob-steps{display:flex;flex-direction:column;gap:10px;width:100%}
.ob-st{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font:700 17px var(--body);opacity:0;animation:obin .5s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
.ob-st b{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:900 16px var(--display)}
@keyframes obin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.ob-tiles{position:relative;display:flex;gap:10px;width:100%;justify-content:center}
.ob-tile{position:relative;width:30%;aspect-ratio:25/30;max-width:110px;border:2px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.ob-tile i{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
.ob-tile.pick{animation:obpick 3s ease-in-out infinite}
.ob-tile .chk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font:800 14px/24px var(--body);text-align:center;animation:obchk 3s ease-in-out infinite}
@keyframes obpick{0%,35%{border-color:var(--line);box-shadow:none}45%,90%{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}100%{border-color:var(--line);box-shadow:none}}
@keyframes obchk{0%,35%{opacity:0;transform:scale(.5)}45%,90%{opacity:1;transform:none}100%{opacity:0;transform:scale(.5)}}
.ob-hand{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 8px rgba(255,255,255,.2);left:70%;top:110%;animation:obhand 3s ease-in-out infinite}
@keyframes obhand{0%{left:75%;top:115%;opacity:0}15%{opacity:1}35%{left:50%;top:55%;transform:scale(1)}40%{transform:scale(.8)}50%{transform:scale(1)}85%{opacity:1}100%{left:50%;top:55%;opacity:0}}
.ob-lock{position:relative;display:grid;place-items:center;width:170px;height:170px}
.ob-lock img{width:110px;height:auto;position:relative;animation:float 3s ease-in-out infinite}
.ob-ring{position:absolute;inset:10px;border:2px solid var(--gold);border-radius:50%;opacity:0;animation:obring 3s ease-out infinite}
.ob-ring.r2{animation-delay:1.5s}
@keyframes obring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:6px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer;transition:width .25s,background .25s}
.dots button.on{width:26px;border-radius:5px;background:var(--gold)}
@media (prefers-reduced-motion:reduce){.ob-st{animation:none;opacity:1}.ob-tile.pick,.ob-tile .chk,.ob-hand,.ob-ring,.ob-lock img{animation:none}.ob-tile.pick{border-color:var(--gold)}.ob-tile .chk{opacity:1}.ob-hand,.ob-ring{display:none}.step,.pokalbtn,.pokal.spin{animation:none}.bar i{transition:none}}
</style>

<div id="bg"></div><div id="glow"></div>
<div id="app">
  <div class="top" id="top" data-hide="1">
    <div class="bar"><i id="barI"></i></div>
    <button type="button" class="gear" id="gear" aria-label="Admin-Bereich"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.62.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.76 0-1.36.41-1.51 1z"/></svg></button>
  </div>
  <main id="stage"></main>
</div>

<script>

function bgPattern(){
  const bg = $('bg'); bg.innerHTML = '';
  const sx = 96, sy = 118, w = innerWidth, h = innerHeight;
  const frag = document.createDocumentFragment();
  for (let r = 0, y = -10; y < h + sy; r++, y += sy) {
    for (let x = (r % 2 ? sx/2 : 0) - 20; x < w + sx; x += sx) {
      const im = new Image(); im.src = 'pokal-klein.webp'; im.alt = ''; im.decoding = 'async';
      im.style.cssText = 'position:absolute;left:'+x+'px;top:'+y+'px;width:36px;height:auto;transform:rotate('+(r % 2 ? 9 : -9)+'deg)';
      frag.appendChild(im);
    }
  }
  bg.appendChild(frag);
}

const MSG = {
  already_voted: 'Mit diesem Namen wurde schon abgestimmt.',
  name_missing: 'Bitte gib deinen Namen ein.',
  wrong_password: 'Falsches Passwort.'
};
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(CONFIG.supabaseUrl.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{apikey:CONFIG.supabaseKey, Authorization:'Bearer '+CONFIG.supabaseKey, 'Content-Type':'application/json'},
      body: JSON.stringify(args)
    });
  } catch(e){ throw new Error('Keine Verbindung zur Datenbank. Prüfe supabaseUrl in index.html.'); }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const m = j && j.message; throw new Error(MSG[m] || ('Fehler ' + r.status + ': ' + (m || (j && (j.hint || j.error || j.msg)) || 'unbekannt'))); }
  return j;
}
const demo = {
  load(){ try { return JSON.parse(localStorage.getItem('bod_demo')||'[]'); } catch(e){ return []; } },
  save(v){ try { localStorage.setItem('bod_demo', JSON.stringify(v)); } catch(e){} }
};
const api = {
  async submit(v){
    if (LIVE) return rpc('submit_vote', {p_name:v.name, p_role:v.role, p_picks:v.picks});
    const list = demo.load(), k = v.name.toLowerCase();
    if (list.some(x => x.name.toLowerCase() === k)) throw new Error(MSG.already_voted);
    list.push({id:String(Date.now())+Math.random().toString(36).slice(2,6), name:v.name, role:v.role, picks:v.picks, ts:new Date().toISOString()});
    demo.save(list);
  },
  async hasVoted(name){
    if (LIVE) return rpc('has_voted', {p_name:name});
    const k = name.trim().toLowerCase();
    return demo.load().some(x => x.name.toLowerCase() === k);
  },
  async results(pw){
    if (LIVE) return rpc('admin_results', {p_password:pw});
    if (pw !== 'demo') throw new Error(MSG.wrong_password);
    return demo.load().reverse();
  },
  async remove(pw, id){
    if (LIVE) return rpc('admin_delete', {p_password:pw, p_id:id});
    demo.save(demo.load().filter(x => x.id !== id));
  }
};

    Object.keys(S.picks).forEach(k => { if (S.picks[k] === S.self && S.role === 'spieler') delete S.picks[k]; });
  }
  if (id.startsWith('cat:') && !S.picks[id.slice(4)]) { S.err = id==='cat:spruch' ? 'Bitte wähle einen Spruch aus.' : 'Bitte wähle eine Person aus.'; return render(); }
  go(S.i + 1);
}
async function submit(){
  if (S.busy) return;
  S.busy = true; S.err = ''; render();
  try {
    await api.submit({name:who(), role:S.role, picks:S.picks});
    try { localStorage.setItem('bod_voted', who()); } catch(e){}
    S.busy = false; S.was = false; go(steps.length - 1);
  } catch(e){
    S.busy = false; S.err = e.message || 'Das hat nicht geklappt.'; render();
  }
}

$('stage').addEventListener('input', e => { if (e.target.id === 'fSearch') applySearch(e.target.value); });
$('stage').addEventListener('change', e => {
  if (e.target.id === 'fSelf') { S.self = e.target.value; S.err = ''; const m = document.querySelector('.msg'); if (m) m.textContent = ''; }
});
$('stage').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') next();
  else if (a === 'back') { readInputs(); go(S.i - 1); }
  else if (a === 'role') { S.role = b.dataset.v; S.err = ''; render(); setTimeout(() => go(iWho), 220); }
  else if (a === 'pick') {
    S.picks[b.dataset.cat] = b.dataset.v; S.err = '';
    document.querySelectorAll('.tile,.quote').forEach(t => t.setAttribute('aria-pressed', String(t === b)));
    const m = document.querySelector('.msg'); if (m) m.textContent = '';
  }
  else if (a === 'obnext') { if (S.ob < 3) { S.ob++; render(); } else go(iRole); }
  else if (a === 'obback') { if (S.ob > 0) { S.ob--; render(); } else go(S.i - 1); }
  else if (a === 'obskip') go(iRole);
  else if (a === 'dot') { S.ob = parseInt(b.dataset.k, 10); render(); }
  else if (a === 'jump') go(parseInt(b.dataset.i, 10));
  else if (a === 'pokal') pokalTap(b);
  else if (a === 'info') showInfo(b.dataset.cat);
  else if (a === 'submit') submit();
});

/* ---------- Pokal antippen: drehen, Konfetti, Spruch ---------- */
const POKAL_SPRUECHE = ["Prost!", "Noch nicht gewonnen. Erst abstimmen!", "Finger weg vom Pokal!", "Der Ausredenweltmeister war's.", "Vorsicht, der ist schwer.", "Den will jeder haben."];
let pokalN = 0, fxRaf = 0;
function confetti(x, y){
  let cv = $('fx');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv); }
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#e3ab28','#f4c85a','#ffffff','#6f8092','#b57c00'];
  const ps = Array.from({length:70}, () => {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
    return {x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 4, w:5 + Math.random() * 6, h:3 + Math.random() * 4, r:Math.random() * 6, vr:(Math.random() - .5) * .4, c:cols[Math.floor(Math.random() * cols.length)]};
  });
  cancelAnimationFrame(fxRaf);
  let t = 0;
  const step = () => {
    t++; g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.globalAlpha = Math.max(0, 1 - t / 95); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); });
    if (t < 95) fxRaf = requestAnimationFrame(step); else g.clearRect(0, 0, innerWidth, innerHeight);
  };
  fxRaf = requestAnimationFrame(step);
}
function pokalTap(btn){
  const img = btn.querySelector('.pokal'), r = btn.getBoundingClientRect();
  img.classList.remove('spin'); void img.offsetWidth; img.classList.add('spin');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) confetti(r.left + r.width / 2, r.top + r.height * 0.45);
  const t = $('pokalTxt'); if (t) t.textContent = POKAL_SPRUECHE[pokalN % POKAL_SPRUECHE.length];
  pokalN++;
}

/* ---------- Admin (Zahnrad + Passwort) ---------- */
const ov = $('overlay');
function closeOv(){ ov.hidden = true; ov.innerHTML = ''; }
$('gear').addEventListener('click', () => {
  ov.hidden = false;
  ov.innerHTML = '<form class="sheet" id="loginForm"><h3>Admin</h3>'+
    '<div class="field"><label for="apw">Passwort</label><input type="password" id="apw" autocomplete="current-password"></div>'+
    '<p class="msg" id="aerr" role="alert"></p>'+
    '<div class="row"><button type="button" class="ghost" id="aclose">Abbrechen</button><button type="submit" class="btn" id="ago">Öffnen</button></div>'+
    (LIVE ? '' : '<p class="small">Demo-Modus: Passwort ist "demo".</p>')+'</form>';
  $('apw').focus();
  $('aclose').onclick = closeOv;
  $('loginForm').onsubmit = async ev => {
    ev.preventDefault();
    const pw = $('apw').value; $('ago').disabled = true; $('aerr').textContent = '';
    try { showAdmin(pw, await api.results(pw)); }
    catch(e){ $('aerr').textContent = e.message; $('ago').disabled = false; }
  };
});
let armed = null, aF = 'alle';
function showAdmin(pw, votes){
  votes = (votes || []).slice().sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const names = {}; votes.forEach(v => { const k = String(v.name).toLowerCase(); names[k] = (names[k]||0)+1; });
  const vf = votes.filter(v => aF === 'alle' || v.role === aF);
  const tal = CONFIG.categories.map(c => {
    const n = {}; vf.forEach(v => { const p = v.picks && v.picks[c.id]; if (p) n[p] = (n[p]||0)+1; });
    const list = Object.entries(n).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
    const total = list.reduce((x,y) => x + y[1], 0);
    const top = list.length ? list[0][1] : 0;
    return {c, list, total, top, win: list.filter(e => e[1] === top).map(e => e[0])};
  });
  const pct = (k,t) => t ? Math.round(k/t*100)+'%' : '';
  const winners = '<div class="res win"><h4>Gewinner</h4>'+tal.map(t =>
    '<div class="wrow"><small>'+esc(t.c.name)+'</small>'+(t.total
      ? '<b>'+t.win.map(esc).join(' &amp; ')+'</b><span>'+(t.win.length>1 ? '<em>Gleichstand</em> · ':'')+t.top+' von '+t.total+' Stimmen ('+pct(t.top,t.total)+')</span>'
      : '<span>Noch keine Stimmen</span>')+'</div>').join('')+
    '<div class="arow"><button type="button" class="ghost" id="acopy">Ergebnis kopieren</button><button type="button" class="ghost" id="acsv">Auswertung als CSV</button></div></div>';
  const res = tal.map(t =>
    '<div class="res"><h4>'+esc(t.c.name)+'</h4>'+(t.list.length ? '' : '<p class="small">Noch keine Stimmen.</p>')+
    t.list.map(([p,k],i) => '<div class="tally'+(k===t.top?' top':'')+'"><span>'+esc(p)+'</span><span>'+k+' · '+pct(k,t.total)+'</span><span class="b"><i style="width:'+Math.round(k/(t.top||1)*100)+'%"></i></span></div>').join('')+'</div>').join('');
  const chips = '<div class="chips">'+[['alle','Alle'],['spieler','Nur Spieler'],['fan','Nur Fans']].map(([k,l]) => '<button type="button" data-f="'+k+'" class="'+(aF===k?'on':'')+'">'+l+'</button>').join('')+'</div>';
  const fmt = t => { try { return new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
  const rows = votes.map(v => '<tr><td class="'+(names[String(v.name).toLowerCase()]>1?'dup':'')+'">'+esc(v.name)+'</td><td>'+roleLabel(v.role)+'</td><td>'+esc(fmt(v.ts))+'</td><td><button type="button" class="del" data-del="'+esc(v.id)+'">'+(armed===v.id?'Sicher?':'Löschen')+'</button></td></tr>').join('');
  ov.innerHTML = '<div class="sheet wide"><div class="row"><h3>Auswertung</h3><button type="button" class="ghost" id="aout">Schließen</button></div>'+
    (LIVE ? '' : '<span class="tag">Demo-Daten aus diesem Browser</span>')+
    '<div class="stat"><div><b>'+votes.length+'</b><small>Stimmen</small></div><div><b>'+votes.filter(v=>v.role==='spieler').length+'</b><small>Spieler</small></div><div><b>'+votes.filter(v=>v.role==='fan').length+'</b><small>Fans</small></div></div>'+
    chips+winners+res+
    '<div class="res"><h4>Wer hat abgestimmt</h4><p class="small">Gleiche Namen sind rot. Nach dem Löschen kann die Person neu abstimmen.</p><div class="tbox"><table><thead><tr><th>Name</th><th>Rolle</th><th>Zeit</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<button type="button" class="btn full" id="aref">Aktualisieren</button></div>';
  ov.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { aF = b.dataset.f; showAdmin(pw, votes); });
  $('acopy').onclick = async (e) => {
    const txt = 'BIERLOND\'OR '+CONFIG.year+' – Ergebnisse ('+({alle:'alle',spieler:'nur Spieler',fan:'nur Fans'}[aF])+')\n\n'+
      tal.map(t => t.c.name+': '+(t.total ? t.win.join(' & ')+(t.win.length>1?' (Gleichstand)':'')+' – '+t.top+' von '+t.total : 'keine Stimmen')).join('\n');
    try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Kopiert'; } catch(_) { window.prompt('Kopieren:', txt); }
  };
  $('acsv').onclick = () => {
    const q = x => '"'+String(x==null?'':x).replace(/"/g,'""')+'"';
    const line = arr => arr.map(q).join(';');
    const nS = votes.filter(v => v.role === 'spieler').length, nF = votes.filter(v => v.role === 'fan').length;
    const out = [];
    out.push(line(["BIERLOND'OR "+CONFIG.year+" – Auswertung"]));
    out.push(line(['Stimmen gesamt', votes.length, 'Spieler', nS, 'Fans', nF]));
    out.push('');
    out.push(line(['Kategorie','Platz','Name','Stimmen gesamt','Anteil %','Davon Spieler','Davon Fans','Stimmen in Kategorie']));
    CONFIG.categories.forEach(c => {
      const n = {};
      votes.forEach(v => { const p = v.picks && v.picks[c.id]; if (!p) return; (n[p] = n[p] || {t:0,s:0,f:0}).t++; if (v.role === 'spieler') n[p].s++; else n[p].f++; });
      const list = Object.entries(n).sort((x,y) => y[1].t - x[1].t || x[0].localeCompare(y[0]));
      const total = list.reduce((x,y) => x + y[1].t, 0);
      if (!list.length) { out.push(line([c.name,'','keine Stimmen',0,'',0,0,0])); return; }
      let rank = 0, prev = -1;
      list.slice(0,5).forEach(([name,d],i) => {
        if (d.t !== prev) { rank = i + 1; prev = d.t; }
        out.push(line([c.name, rank, name, d.t, String(Math.round(d.t/total*1000)/10).replace('.',','), d.s, d.f, total]));
      });
      const w = list.filter(e => e[1].t === list[0][1].t);
      if (w.length > 1) out.push(line([c.name,'','Hinweis: Gleichstand auf Platz 1 ('+w.length+' Beteiligte)','','','','','']));
    });
    out.push(''); out.push('');
    out.push(line(['Einzelstimmen']));
    out.push(line(['Name','Rolle','Zeit'].concat(CONFIG.categories.map(c => c.name))));
    votes.forEach(v => out.push(line([v.name, v.role === 'spieler' ? 'Spieler' : 'Fan', v.ts].concat(CONFIG.categories.map(c => (v.picks||{})[c.id]||'')))));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    a.download = 'bierlondor-auswertung.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('aout').onclick = () => { armed = null; closeOv(); };
  $('aref').onclick = async () => { try { showAdmin(pw, await api.results(pw)); } catch(e){ closeOv(); } };
  ov.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    if (armed !== id) { armed = id; b.textContent = 'Sicher?'; return; }
    armed = null;
    try { await api.remove(pw, id); showAdmin(pw, await api.results(pw)); } catch(e){ b.textContent = 'Fehler'; }
  });
}

/* Die Datenbank entscheidet: Wurde die Stimme gelöscht, darf man wieder abstimmen. */
async function boot(){
  const n = votedName();
  if (n && n !== '1') {
    try {
      if (await api.hasVoted(n)) { S.was = true; S.i = steps.length - 1; } else clearVoted();
    } catch(e){ clearVoted(); }
  } else if (n) clearVoted();
  render();
}
boot();
