<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bierlond'Or Abstimmung 2027</title>
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: ein Schritt pro Bildschirm, Pokal auf der Startseite, kleines Pokal-Logo als Muster im Hintergrund. Dunkel mit Stahlblau und Gold. */
:root{
  --bg:#0f1216; --panel:#181d24; --line:#2b323c; --fg:#eef0f2; --muted:#8f99a6;
  --steel:#6f8092; --gold:#e3ab28; --gold-hi:#f4c85a; --ink:#1a1203; --warn:#f08a64; --ok:#86c982;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.10}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 38%,rgba(227,171,40,.10),transparent 70%)}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px;height:44px;max-width:560px;width:100%;margin:0 auto}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;transition:opacity .3s}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .45s ease}
.top[data-hide="1"] .bar{opacity:0}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(24,29,36,.7);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.gear:hover{color:var(--gold);border-color:var(--gold)}
.gear svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#stage{flex:1;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding-block:12px}
.step{display:flex;flex-direction:column;gap:18px;animation:in .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h2{font-size:clamp(38px,11vw,56px)}
.lead{color:var(--muted);margin:0}
.intro{align-items:center;text-align:center;gap:6px}
.intro h1{font-size:clamp(44px,12.5vw,92px);letter-spacing:0}
.intro .sub{font-family:var(--display);font-weight:800;font-size:clamp(20px,6vw,30px);letter-spacing:.34em;text-indent:.34em;color:var(--gold)}
.pokal{display:block;width:auto;max-width:min(80vw,330px);height:min(50vh,430px);object-fit:contain;margin:8px 0 12px;-webkit-mask-image:radial-gradient(ellipse 52% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 52% 50% at 50% 50%,#000 62%,transparent 100%);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.btn{font:800 22px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:15px 26px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;min-width:200px;transition:transform .15s,background .15s}
.btn:hover{background:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%}
.ghost{background:none;border:0;color:var(--muted);font:600 15px var(--body);padding:10px 4px;cursor:pointer}
.ghost:hover{color:var(--fg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.nav .btn{flex:1;max-width:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{padding:28px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:800 28px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--gold)}
.big:active{transform:scale(.98)}
.big[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],select,input[type=password]{width:100%;font:500 17px var(--body);padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.small{font-size:13px;color:var(--muted);margin:0}
.msg{margin:0;color:var(--warn);font-size:14px;min-height:1.2em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 16px var(--body);cursor:pointer;text-align:center;overflow-wrap:anywhere;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--steel)}
.opt[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.sum button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:500 16px var(--body);cursor:pointer}
.sum button:last-child{border-bottom:0}
.sum button:hover{background:rgba(255,255,255,.03)}
.sum span:first-child{color:var(--muted);font-size:13px}
.sum b{font-weight:700;text-align:right;overflow-wrap:anywhere}
.done{align-items:center;text-align:center}
.done .logo{width:90px;height:auto}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,15,.88);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet{width:100%;max-width:640px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:6vh;display:flex;flex-direction:column;gap:14px}
.sheet.wide{margin-top:0}
.sheet h3{font:900 30px var(--display);text-transform:uppercase;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:900 36px var(--display);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.res h4{margin:0 0 6px;font:800 22px var(--display);text-transform:uppercase}
.tally{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;margin:8px 0;font-variant-numeric:tabular-nums}
.tally .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tally .b i{display:block;height:100%;background:var(--gold)}
.tally.top span:first-child{font-weight:700}
.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dup{color:var(--warn);font-weight:700}
.del{font:600 13px var(--body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--warn);cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(227,171,40,.15);color:var(--gold)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.step,.pokal{animation:none}.bar i{transition:none}}
</style>

<div id="bg"></div><div id="glow"></div>
<div id="app">
  <div class="top" id="top" data-hide="1">
    <div class="bar"><i id="barI"></i></div>
    <button type="button" class="gear" id="gear" aria-label="Admin-Bereich"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.62.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.76 0-1.36.41-1.51 1z"/></svg></button>
  </div>
  <main id="stage"></main>
</div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* ================= HIER ANPASSEN ================= */
const CONFIG = {
  title: "BIERLOND'OR",
  year: 2027,
  /* Supabase-Zugang (siehe README). Leer lassen = Demo-Modus mit Admin-Passwort "demo". */
  supabaseUrl: "https://uuqytkqmaebonymtcxmg.supabase.co",
  supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cXl0a3FtYWVib255bXRjeG1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MDA2NDksImV4cCI6MjEwOTE3NjY0OX0.bBK3uY6VTTJ_wSdR19u8Qo7q16N4QBkirjbkh_5jHWw",
  categories: [
    {id:"offensiv",  name:"Offensivspieler der Saison", hint:"Tore, Vorlagen, Torgefahr."},
    {id:"defensiv",  name:"Defensivspieler der Saison", hint:"Wer hat hinten dichtgemacht?"},
    {id:"ausrede",   name:"Ausredenweltmeister",        hint:"Der Platz war zu hart, der Ball zu rund."},
    {id:"newcomer",  name:"Newcomer des Jahres",        hint:"Wer hat sich am besten eingelebt?"},
    {id:"spruch",    name:"Spruch des Jahres",          hint:"Wer hat den besten Spruch rausgehauen?"}
  ],
  /* Wer steht wo zur Wahl: O = nur Offensiv, D = nur Defensiv, B = beide */
  onlyOffense: [
    "Adin Beganovic",
    "Benedikt Honold",
    "Marvin Götte",
    "Max Beckmann",
    "Ole Weber",
    "Philip Brüger",
    "Robin Spitzer",
    "Timo Hellmann",
    "Yannick Marks"
  ],
  onlyDefense: [
    "Alen Halilovic",
    "Alexander Brune",
    "Benedict Bald",
    "Benedict Bruder",
    "Christopher von Schaewen",
    "Finn Reiß",
    "Kevin Hellmann",
    "Lars Wohlgemuth",
    "Luca Honold",
    "Lukas Lengefeld",
    "Maximilian Schulte",
    "Nicolas Dähn",
    "Paul Krüger",
    "Philipp Monien",
    "Tim Josephs",
    "Tobias Rauschenbach"
  ],
  /* Nur diese stehen bei "Newcomer des Jahres" zur Wahl */
  newcomer: ["Dennis Mrochen", "Finn Reiß", "Gerry Nah", "Marcel Opitz", "Mohamed Assakali", "Mohamed El Bachiri", "Pascal Börner"],
  both: [
    "Dennis Mrochen",
    "Dustin Kalthoff",
    "Gerry Nah",
    "Jonas Sprute",
    "Leon Ohde",
    "Marcel Opitz",
    "Marco Peter",
    "Maximilian Andresen",
    "Mohamed Assakali",
    "Mohamed El Bachiri",
    "Nico Lichtenthäler",
    "Niklas Blöming",
    "Pascal Börner",
    "Robin Siegner",
    "Timo Haase",
    "Tyreese Slacanin"
  ]
};
/* ================================================= */
CONFIG.players = [...CONFIG.onlyOffense, ...CONFIG.onlyDefense, ...CONFIG.both].sort((a,b) => a.localeCompare(b,'de'));
CONFIG.pools = {offensiv:[...CONFIG.onlyOffense, ...CONFIG.both], defensiv:[...CONFIG.onlyDefense, ...CONFIG.both], newcomer:CONFIG.newcomer};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIVE = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);

/* ---------- Pokal-Logo als Hintergrundmuster ---------- */
function bgPattern(){
  const bg = $('bg'); bg.innerHTML = '';
  const sx = 96, sy = 118, w = innerWidth, h = innerHeight;
  const frag = document.createDocumentFragment();
  for (let r = 0, y = -10; y < h + sy; r++, y += sy) {
    for (let x = (r % 2 ? sx/2 : 0) - 20; x < w + sx; x += sx) {
      const im = new Image(); im.src = 'pokal-logo.png'; im.alt = ''; im.decoding = 'async';
      im.style.cssText = 'position:absolute;left:'+x+'px;top:'+y+'px;width:36px;height:auto;transform:rotate('+(r % 2 ? 9 : -9)+'deg)';
      frag.appendChild(im);
    }
  }
  bg.appendChild(frag);
}
bgPattern();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(bgPattern, 250); });

/* ---------- Daten (Supabase oder Demo im Browser) ---------- */
const MSG = {
  already_voted: 'Mit diesem Namen wurde schon abgestimmt.',
  name_missing: 'Bitte gib deinen Namen ein.',
  wrong_password: 'Falsches Passwort.'
};
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(CONFIG.supabaseUrl.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{apikey:CONFIG.supabaseKey, Authorization:'Bearer '+CONFIG.supabaseKey, 'Content-Type':'application/json'},
      body: JSON.stringify(args)
    });
  } catch(e){ throw new Error('Keine Verbindung zur Datenbank. Prüfe supabaseUrl in index.html.'); }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok) { const m = j && j.message; throw new Error(MSG[m] || ('Fehler ' + r.status + ': ' + (m || (j && (j.hint || j.error || j.msg)) || 'unbekannt'))); }
  return j;
}
const demo = {
  load(){ try { return JSON.parse(localStorage.getItem('bod_demo')||'[]'); } catch(e){ return []; } },
  save(v){ try { localStorage.setItem('bod_demo', JSON.stringify(v)); } catch(e){} }
};
const api = {
  async submit(v){
    if (LIVE) return rpc('submit_vote', {p_name:v.name, p_role:v.role, p_picks:v.picks});
    const list = demo.load(), k = v.name.toLowerCase();
    if (list.some(x => x.name.toLowerCase() === k)) throw new Error(MSG.already_voted);
    list.push({id:String(Date.now())+Math.random().toString(36).slice(2,6), name:v.name, role:v.role, picks:v.picks, ts:new Date().toISOString()});
    demo.save(list);
  },
  async hasVoted(name){
    if (LIVE) return rpc('has_voted', {p_name:name});
    const k = name.trim().toLowerCase();
    return demo.load().some(x => x.name.toLowerCase() === k);
  },
  async results(pw){
    if (LIVE) return rpc('admin_results', {p_password:pw});
    if (pw !== 'demo') throw new Error(MSG.wrong_password);
    return demo.load().reverse();
  },
  async remove(pw, id){
    if (LIVE) return rpc('admin_delete', {p_password:pw, p_id:id});
    demo.save(demo.load().filter(x => x.id !== id));
  }
};

/* ---------- Ablauf ---------- */
const S = {i:0, role:null, name:'', self:'', picks:{}, err:'', busy:false};
const steps = ['intro','role','who', ...CONFIG.categories.map(c => 'cat:'+c.id), 'review', 'done'];
const alreadyVoted = () => { try { return !LIVE ? false : !!localStorage.getItem('bod_voted'); } catch(e){ return false; } };
const optionsFor = c => (CONFIG.pools[c.id] || CONFIG.players).filter(p => !(S.role==='spieler' && p===S.self)).slice().sort((a,b) => a.localeCompare(b,'de'));
const roleLabel = r => r==='spieler' ? 'Aktiver Spieler' : 'Fan';
const who = () => S.role==='spieler' ? S.self : S.name.trim();

function introHTML(){
  return '<div class="intro">'+
    '<div class="kicker">Die Preisverleihung</div>'+
    '<h1>'+esc(CONFIG.title)+'</h1>'+
    '<div class="sub">ABSTIMMUNG '+CONFIG.year+'</div>'+
    '<button type="button" class="btn" style="margin-top:36px" data-act="next">Los geht’s</button>'+
    (LIVE ? '' : '<p class="small">Demo-Modus: Stimmen bleiben nur in diesem Browser.</p>')+
  '</div>';
}
function roleHTML(){
  return '<div class="kicker">Schritt 1</div><h2>Wer bist du?</h2>'+
    '<p class="lead">Aktiver Spieler oder Fan, beides darf abstimmen.</p>'+
    '<div class="two">'+
      '<button type="button" class="big" data-act="role" data-v="spieler" aria-pressed="'+(S.role==='spieler')+'">Aktiver Spieler</button>'+
      '<button type="button" class="big" data-act="role" data-v="fan" aria-pressed="'+(S.role==='fan')+'">Fan</button>'+
    '</div>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button></div>';
}
function whoHTML(){
  const sp = S.role === 'spieler';
  const field = sp
    ? '<div class="field"><label for="fSelf">Wähle dich aus der Liste</label><select id="fSelf"><option value="">Bitte wählen</option>'+
        CONFIG.players.map(p => '<option value="'+esc(p)+'"'+(p===S.self?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select></div>'
    : '<div class="field"><label for="fName">Dein Name</label><input type="text" id="fName" maxlength="60" autocomplete="name" placeholder="Name" value="'+esc(S.name)+'"></div>';
  return '<div class="kicker">Schritt 2</div><h2>'+(sp ? 'Das bist du' : 'Dein Name')+'</h2>'+
    field+
    '<p class="msg" role="alert">'+esc(S.err)+'</p>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button><button type="button" class="btn" data-act="next">Weiter</button></div>';
}
function catHTML(c, idx){
  const cur = S.picks[c.id];
  return '<div class="kicker">Kategorie '+(idx+1)+' von '+CONFIG.categories.length+'</div><h2>'+esc(c.name)+'</h2>'+
    '<p class="lead">'+esc(c.hint||'')+'</p>'+
    '<div class="grid">'+optionsFor(c).map(p => '<button type="button" class="opt" data-act="pick" data-cat="'+esc(c.id)+'" data-v="'+esc(p)+'" aria-pressed="'+(cur===p)+'">'+esc(p)+'</button>').join('')+'</div>'+
    '<p class="msg" role="alert">'+esc(S.err)+'</p>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button><button type="button" class="btn" data-act="next">Weiter</button></div>';
}
function reviewHTML(){
  const rows = CONFIG.categories.map((c,k) =>
    '<button type="button" data-act="jump" data-i="'+(3+k)+'"><span>'+esc(c.name)+'</span><b>'+esc(S.picks[c.id]||'')+'</b></button>').join('');
  return '<div class="kicker">Fast fertig</div><h2>Alles richtig?</h2>'+
    '<p class="lead">Tippe auf eine Zeile, um die Wahl zu ändern.</p>'+
    '<div class="sum"><button type="button" data-act="jump" data-i="2"><span>'+roleLabel(S.role)+'</span><b>'+esc(who())+'</b></button>'+rows+'</div>'+
    '<p class="msg" role="alert">'+esc(S.err)+'</p>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button><button type="button" class="btn" data-act="submit"'+(S.busy?' disabled':'')+'>Abschicken</button></div>';
}
function doneHTML(was){
  return '<div class="done step" style="animation:none">'+'<img class="logo" src="pokal-logo.png" alt="">'+
    '<h2>'+(was ? 'Schon dabei' : 'Danke, '+esc(who()))+'</h2>'+
    '<p class="lead">'+(was ? 'Von diesem Gerät wurde schon abgestimmt.' : 'Deine Stimme ist gespeichert.')+' Das Ergebnis gibt es bei der Preisverleihung.</p></div>';
}

function render(){
  const id = steps[S.i];
  let html = '';
  if (id === 'intro') html = introHTML();
  else if (id === 'role') html = roleHTML();
  else if (id === 'who') html = whoHTML();
  else if (id.startsWith('cat:')) { const k = S.i - 3; html = catHTML(CONFIG.categories[k], k); }
  else if (id === 'review') html = reviewHTML();
  else html = doneHTML(S.was);
  $('stage').innerHTML = '<div class="step">'+html+'</div>';
  const hide = id === 'intro' || id === 'done';
  $('top').dataset.hide = hide ? '1' : '0';
  $('barI').style.width = Math.round((S.i - 1) / (steps.length - 3) * 100) + '%';
  window.scrollTo(0, 0);
}
function go(i){ S.i = Math.max(0, Math.min(steps.length-1, i)); S.err = ''; render(); }

function readInputs(){
  const sf = $('fSelf'), nf = $('fName');
  if (sf) S.self = sf.value;
  if (nf) S.name = nf.value;
}
async function next(){
  const id = steps[S.i];
  if (id === 'who') {
    readInputs();
    if (S.role === 'spieler' && !S.self) { S.err = 'Bitte wähle aus der Liste, wer du bist.'; return render(); }
    if (S.role === 'fan' && S.name.trim().length < 2) { S.err = 'Bitte gib deinen Namen ein.'; return render(); }
    try {
      if (await api.hasVoted(who())) { S.err = S.role === 'spieler' ? S.self + ' hat bereits abgestimmt.' : MSG.already_voted; return render(); }
    } catch(e){}
    Object.keys(S.picks).forEach(k => { if (S.picks[k] === S.self && S.role === 'spieler') delete S.picks[k]; });
  }
  if (id.startsWith('cat:') && !S.picks[id.slice(4)]) { S.err = 'Bitte wähle eine Person aus.'; return render(); }
  go(S.i + 1);
}
async function submit(){
  if (S.busy) return;
  S.busy = true; S.err = ''; render();
  try {
    await api.submit({name:who(), role:S.role, picks:S.picks});
    try { localStorage.setItem('bod_voted','1'); } catch(e){}
    S.busy = false; S.was = false; go(steps.length - 1);
  } catch(e){
    S.busy = false; S.err = e.message || 'Das hat nicht geklappt.'; render();
  }
}

$('stage').addEventListener('change', e => {
  if (e.target.id === 'fSelf') { S.self = e.target.value; S.err = ''; const m = document.querySelector('.msg'); if (m) m.textContent = ''; }
});
$('stage').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') next();
  else if (a === 'back') { readInputs(); go(S.i - 1); }
  else if (a === 'role') { S.role = b.dataset.v; S.err = ''; render(); setTimeout(() => go(2), 220); }
  else if (a === 'pick') { S.picks[b.dataset.cat] = b.dataset.v; S.err = ''; render(); }
  else if (a === 'jump') go(parseInt(b.dataset.i, 10));
  else if (a === 'submit') submit();
});

/* ---------- Admin (Zahnrad + Passwort) ---------- */
const ov = $('overlay');
function closeOv(){ ov.hidden = true; ov.innerHTML = ''; }
$('gear').addEventListener('click', () => {
  ov.hidden = false;
  ov.innerHTML = '<form class="sheet" id="loginForm"><h3>Admin</h3>'+
    '<div class="field"><label for="apw">Passwort</label><input type="password" id="apw" autocomplete="current-password"></div>'+
    '<p class="msg" id="aerr" role="alert"></p>'+
    '<div class="row"><button type="button" class="ghost" id="aclose">Abbrechen</button><button type="submit" class="btn" id="ago">Öffnen</button></div>'+
    (LIVE ? '' : '<p class="small">Demo-Modus: Passwort ist "demo".</p>')+'</form>';
  $('apw').focus();
  $('aclose').onclick = closeOv;
  $('loginForm').onsubmit = async ev => {
    ev.preventDefault();
    const pw = $('apw').value; $('ago').disabled = true; $('aerr').textContent = '';
    try { showAdmin(pw, await api.results(pw)); }
    catch(e){ $('aerr').textContent = e.message; $('ago').disabled = false; }
  };
});
let armed = null;
function showAdmin(pw, votes){
  votes = (votes || []).slice().sort((a,b) => new Date(b.ts) - new Date(a.ts));
  const names = {}; votes.forEach(v => { const k = String(v.name).toLowerCase(); names[k] = (names[k]||0)+1; });
  const res = CONFIG.categories.map(c => {
    const n = {}; votes.forEach(v => { const p = v.picks && v.picks[c.id]; if (p) n[p] = (n[p]||0)+1; });
    const list = Object.entries(n).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
    const max = list.length ? list[0][1] : 1;
    return '<div class="res"><h4>'+esc(c.name)+'</h4>'+(list.length ? '' : '<p class="small">Noch keine Stimmen.</p>')+
      list.map(([p,k],i) => '<div class="tally'+(i===0?' top':'')+'"><span>'+esc(p)+'</span><span>'+k+'</span><span class="b"><i style="width:'+Math.round(k/max*100)+'%"></i></span></div>').join('')+'</div>';
  }).join('');
  const fmt = t => { try { return new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
  const rows = votes.map(v => '<tr><td class="'+(names[String(v.name).toLowerCase()]>1?'dup':'')+'">'+esc(v.name)+'</td><td>'+roleLabel(v.role)+'</td><td>'+esc(fmt(v.ts))+'</td><td><button type="button" class="del" data-del="'+esc(v.id)+'">'+(armed===v.id?'Sicher?':'Löschen')+'</button></td></tr>').join('');
  ov.innerHTML = '<div class="sheet wide"><div class="row"><h3>Auswertung</h3><button type="button" class="ghost" id="aout">Schließen</button></div>'+
    (LIVE ? '' : '<span class="tag">Demo-Daten aus diesem Browser</span>')+
    '<div class="stat"><div><b>'+votes.length+'</b><small>Stimmen</small></div><div><b>'+votes.filter(v=>v.role==='spieler').length+'</b><small>Spieler</small></div><div><b>'+votes.filter(v=>v.role==='fan').length+'</b><small>Fans</small></div></div>'+
    res+
    '<div class="res"><h4>Wer hat abgestimmt</h4><p class="small">Gleiche Namen sind rot. Nach dem Löschen kann die Person neu abstimmen.</p><div class="tbox"><table><thead><tr><th>Name</th><th>Rolle</th><th>Zeit</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<button type="button" class="btn full" id="aref">Aktualisieren</button></div>';
  $('aout').onclick = () => { armed = null; closeOv(); };
  $('aref').onclick = async () => { try { showAdmin(pw, await api.results(pw)); } catch(e){ closeOv(); } };
  ov.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    if (armed !== id) { armed = id; b.textContent = 'Sicher?'; return; }
    armed = null;
    try { await api.remove(pw, id); showAdmin(pw, await api.results(pw)); } catch(e){ b.textContent = 'Fehler'; }
  });
}

/* ---------- Start ---------- */
if (alreadyVoted()) { S.was = true; S.i = steps.length - 1; }
render();
</script>
