<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bester Weihnachtssweater · HSC II</title>
<meta name="theme-color" content="#0f1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1216; --panel:#181d24; --line:#2b323c; --fg:#eef0f2; --muted:#8f99a6;
  --gold:#e3ab28; --gold-hi:#f4c85a; --ink:#1a1203; --red:#d8463c; --green:#3a9a63; --warn:#f08a64;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 35%,rgba(216,70,60,.13),transparent 70%)}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:14px;height:44px;max-width:520px;width:100%;margin:0 auto}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;transition:opacity .3s}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .45s ease}
.top[data-hide="1"] .bar{opacity:0}
.gear{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(24,29,36,.7);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.gear:hover{color:var(--gold);border-color:var(--gold)}
.gear svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#stage{flex:1;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding-block:12px}
.step{display:flex;flex-direction:column;gap:18px;animation:in .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,13vw,84px)}
h2{font-size:clamp(36px,10.5vw,54px)}
.lead{color:var(--muted);margin:0}
.center{align-items:center;text-align:center}
.art{display:flex;justify-content:center}
.sweater{width:min(62vw,230px);height:auto;animation:sway 4s ease-in-out infinite;transform-origin:50% 10%;filter:drop-shadow(0 12px 30px rgba(216,70,60,.35))}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sweater .blink{animation:blink 1.6s steps(2) infinite}
.sweater .blink.b2{animation-delay:.8s}
@keyframes blink{50%{opacity:.25}}
.evt{margin:0;font:600 14px var(--body);color:var(--gold)}
.btn{font:800 22px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:15px 26px;border:0;border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;min-width:200px;transition:transform .15s,background .15s}
.btn:hover{background:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--gold)}
.ghost{background:none;border:0;color:var(--muted);font:600 15px var(--body);padding:10px 4px;cursor:pointer}
.ghost:hover{color:var(--fg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.nav .btn{flex:1;max-width:260px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password]{width:100%;font:500 18px var(--body);padding:15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
input[type=text]:focus,input[type=password]:focus{border-color:var(--gold);outline:none}
.small{font-size:13px;color:var(--muted);margin:0}
.msg{margin:0;color:var(--warn);font-size:14px;min-height:1.2em}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--body);cursor:pointer}
.sugg button:hover{border-color:var(--gold);color:var(--gold)}
/* Onboarding */
.onb{display:flex;flex-direction:column;gap:14px}
.ob-art{min-height:170px;margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.ob-steps{display:flex;flex-direction:column;gap:10px;width:100%}
.ob-st{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);font:700 17px var(--body);opacity:0;animation:obin .5s cubic-bezier(.2,.7,.2,1) var(--d) forwards}
.ob-st b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:900 16px var(--display)}
@keyframes obin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.ob-gift{font-size:96px;line-height:1;animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.ob-lock{position:relative;display:grid;place-items:center;width:160px;height:160px;font-size:70px}
.ob-ring{position:absolute;inset:10px;border:2px solid var(--gold);border-radius:50%;opacity:0;animation:obring 3s ease-out infinite}
.ob-ring.r2{animation-delay:1.5s}
@keyframes obring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:4px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer;transition:width .25s,background .25s}
.dots button.on{width:26px;border-radius:5px;background:var(--gold)}
/* Danke */
.thx{font-size:84px;line-height:1;animation:hop 1.8s ease-in-out infinite}
.card{display:flex;flex-direction:column;gap:4px;align-items:center;padding:16px;border:2px solid var(--gold);border-radius:14px;background:var(--panel);width:100%}
.card small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.card b{font:900 30px/1.05 var(--display);text-transform:uppercase;color:var(--gold);overflow-wrap:anywhere}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* Admin */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,15,.9);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet{width:100%;max-width:640px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:6vh;display:flex;flex-direction:column;gap:14px}
.sheet.wide{margin-top:0}
.sheet h3{font:900 30px var(--display);text-transform:uppercase;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:900 34px var(--display);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:13px}
.res{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.res.win{border-color:var(--gold)}
.res h4{margin:0 0 8px;font:800 22px var(--display);text-transform:uppercase}
.wbig{font:900 34px/1.05 var(--display);text-transform:uppercase;color:var(--gold)}
.tie{color:#ff8a7a;font-weight:700;font-size:14px}
.rk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rk:last-child{border-bottom:0}
.rk .n{color:var(--muted);font-weight:700}
.rk .nm{font-weight:700;overflow-wrap:anywhere}
.rk .ct{font-weight:700}
.rk .b{grid-column:2/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rk .b i{display:block;height:100%;background:var(--gold)}
.rk .var{grid-column:2/-1;font-size:12px;color:var(--muted)}
.rk select{grid-column:2/-1;font:500 13px var(--body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);max-width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1;min-width:150px;font-size:17px;padding:12px 14px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td{overflow-wrap:anywhere}
td.t{white-space:nowrap;color:var(--muted)}
.del{font:600 13px var(--body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--warn);cursor:pointer}
/* Beamer-Gewinner */
.reveal{position:fixed;inset:0;z-index:30;background:radial-gradient(70% 60% at 50% 45%,#2a1512,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vh 4vw;cursor:pointer}
.reveal .k{font:800 clamp(18px,3vw,34px) var(--display);letter-spacing:.3em;text-indent:.3em;color:var(--gold);text-transform:uppercase}
.reveal .w{font:900 clamp(56px,11vw,180px)/.95 var(--display);text-transform:uppercase;color:var(--fg);text-shadow:0 0 50px rgba(227,171,40,.45);animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both}
.reveal .s{font:600 clamp(16px,2.2vw,28px) var(--body);color:var(--muted)}
.reveal .sus{font:900 clamp(48px,9vw,140px) var(--display);color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35;transform:scale(.94)}}
.reveal .x{position:absolute;bottom:3vh;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.step,.sweater,.ob-st,.ob-gift,.thx,.ob-ring,.reveal .w,.reveal .sus{animation:none!important;opacity:1}.ob-ring{display:none}}
</style>

<canvas id="snow" aria-hidden="true"></canvas><div id="glow"></div>
<div id="app">
  <div class="top" id="top" data-hide="1">
    <div class="bar"><i id="barI"></i></div>
    <button type="button" class="gear" id="gear" aria-label="Admin-Bereich"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.62.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.76 0-1.36.41-1.51 1z"/></svg></button>
  </div>
  <main id="stage"></main>
</div>
<div id="overlay" class="overlay" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script src="config.js"></script>
<script>
/* ================= HIER ANPASSEN ================= */
const CONFIG = {
  year: 2026,
  supabaseUrl: (window.BOD_CONFIG && window.BOD_CONFIG.supabaseUrl) || "",
  supabaseKey: (window.BOD_CONFIG && window.BOD_CONFIG.supabaseKey) || ""
};
/* ================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s||'').trim().replace(/\s+/g,' ').slice(0,60);
const fold = s => clean(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'');
const LIVE = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- Schnee ---------- */
(function(){
  const c = $('snow'), x = c.getContext('2d'); let f = [], W, H;
  const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; f = Array.from({length: Math.min(90, Math.round(W*H/14000))}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.2+.6, s:Math.random()*.6+.25, d:Math.random()*Math.PI*2})); };
  size(); addEventListener('resize', size);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function tick(){ x.clearRect(0,0,W,H); x.fillStyle = 'rgba(255,255,255,.55)';
    for (const p of f){ p.y += p.s; p.d += .01; p.x += Math.sin(p.d)*.3; if (p.y > H+5){ p.y = -5; p.x = Math.random()*W; } x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }
    requestAnimationFrame(tick); })();
})();

/* ---------- Konfetti ---------- */
function confetti(ms){
  const c = $('fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#e3ab28','#f4c85a','#d8463c','#3a9a63','#ffffff'];
  const P = Array.from({length:160}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, vx:(Math.random()-.5)*3, vy:Math.random()*3+2, r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.3, col:cols[Math.random()*cols.length|0]}));
  const end = performance.now() + (ms||3500);
  (function tick(t){ x.clearRect(0,0,c.width,c.height);
    for (const p of P){ p.x += p.vx; p.y += p.vy; p.a += p.va; if (t < end && p.y > c.height+20){ p.y = -20; p.x = Math.random()*c.width; }
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.col; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }
    if (t < end || P.some(p => p.y < c.height+20)) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })(performance.now());
}

/* ---------- Daten ---------- */
const MSG = {
  already_voted: 'Mit diesem Namen wurde schon abgestimmt.',
  name_missing: 'Bitte gib deinen Namen ein.',
  pick_missing: 'Bitte trag ein, wer das beste Outfit hat.',
  self_vote: 'Für dich selbst stimmen gilt nicht.',
  wrong_password: 'Falsches Passwort.'
};
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(CONFIG.supabaseUrl.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{apikey:CONFIG.supabaseKey, Authorization:'Bearer '+CONFIG.supabaseKey, 'Content-Type':'application/json'},
      body: JSON.stringify(args)
    });
  } catch(e){ throw new Error('Keine Verbindung. Prüfe dein Internet und versuch es nochmal.'); }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!r.ok) {
    const m = j && j.message;
    if (r.status === 404 || /sweater_/.test(m||'') && /not find|does not exist/.test(m||'')) throw new Error('Datenbank noch nicht eingerichtet: sweater.sql in Supabase ausführen.');
    throw new Error(MSG[m] || ('Fehler ' + r.status + ': ' + (m || 'unbekannt')));
  }
  return j;
}
const demo = {
  load(){ try { return JSON.parse(store.get('sw_demo')||'[]'); } catch(e){ return []; } },
  save(v){ store.set('sw_demo', JSON.stringify(v)); }
};
const api = {
  async submit(voter, pick){
    if (LIVE) return rpc('sweater_submit', {p_voter:voter, p_pick:pick});
    const l = demo.load();
    if (fold(voter) === fold(pick)) throw new Error(MSG.self_vote);
    if (l.some(v => v.voter.toLowerCase() === voter.toLowerCase())) throw new Error(MSG.already_voted);
    l.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), voter, pick, ts:new Date().toISOString()}); demo.save(l);
  },
  async results(pw){
    if (LIVE) return rpc('sweater_results', {p_password:pw});
    if (pw !== 'demo') throw new Error(MSG.wrong_password);
    return demo.load().slice().reverse();
  },
  async remove(pw, id){
    if (LIVE) return rpc('sweater_delete', {p_password:pw, p_id:id});
    demo.save(demo.load().filter(v => v.id !== id));
  }
};

/* ---------- Ablauf ---------- */
const SWEATER = '<svg class="sweater" viewBox="0 0 200 190" aria-hidden="true">'+
  '<path d="M62 18 L38 26 L8 70 L30 88 L44 70 L44 176 L156 176 L156 70 L170 88 L192 70 L162 26 L138 18 Q100 44 62 18Z" fill="#b8352d" stroke="#7d211b" stroke-width="3" stroke-linejoin="round"/>'+
  '<path d="M62 18 Q100 44 138 18" fill="none" stroke="#f1ece3" stroke-width="7" stroke-linecap="round"/>'+
  '<rect x="44" y="160" width="112" height="16" fill="#2f7d50"/><path d="M8 70 L30 88 L34 83 L12 66Z M192 70 L170 88 L166 83 L188 66Z" fill="#2f7d50"/>'+
  '<g fill="#f1ece3">'+[0,1,2,3,4,5,6].map(i=>'<path d="M'+(52+i*16)+' 66 l6 -8 l6 8 l-6 8z"/>').join('')+
  [0,1,2,3,4,5,6].map(i=>'<path d="M'+(52+i*16)+' 146 l6 -8 l6 8 l-6 8z"/>').join('')+'</g>'+
  '<path d="M100 84 L122 132 L78 132Z" fill="#2f7d50"/><rect x="95" y="132" width="10" height="9" fill="#7d4b25"/>'+
  '<path d="M100 74 l3 7 h7 l-6 4 l2 7 l-6 -4 l-6 4 l2 -7 l-6 -4 h7z" fill="#e3ab28"/>'+
  '<circle class="blink" cx="92" cy="104" r="4" fill="#e3ab28"/><circle class="blink b2" cx="108" cy="114" r="4" fill="#f1ece3"/><circle class="blink" cx="88" cy="124" r="4" fill="#f1ece3"/><circle class="blink b2" cx="112" cy="126" r="4" fill="#e3ab28"/>'+
'</svg>';

const S = {i:0, ob:0, voter:'', pick:'', err:'', busy:false};
const steps = ['intro','onb','voter','pick','done'];

function introHTML(){
  return '<div class="step center">'+
    '<div class="kicker">HSC II Weihnachtsfeier · '+CONFIG.year+'</div>'+
    '<h1>Bester Weihnachts&shy;sweater</h1>'+
    '<div class="art">'+SWEATER+'</div>'+
    '<p class="evt">Wer hat heute das beste Outfit an?</p>'+
    '<button type="button" class="btn" data-act="next">Jetzt abstimmen</button>'+
    (LIVE ? '' : '<p class="small">Demo-Modus: Stimmen bleiben nur in diesem Browser.</p>')+
  '</div>';
}
function onbHTML(){
  const slides = [
    {k:'So geht’s', h:'Drei Schritte, fertig.', p:'Dauert keine 30 Sekunden.',
     art:'<div class="ob-steps">'+['Deinen Namen eintragen','Bestes Outfit eintragen','Abschicken'].map((t,i)=>'<div class="ob-st" style="--d:'+(0.15+i*0.35)+'s"><b>'+(i+1)+'</b><span>'+t+'</span></div>').join('')+'</div>'},
    {k:'Der Preis', h:'Es gibt was zu gewinnen.', p:'Wer die meisten Stimmen holt, gewinnt eine Verzehrkarte. Der Gewinner wird heute Abend verkündet.',
     art:'<div class="ob-gift">&#127873;</div>'},
    {k:'Fair bleiben', h:'Eine Stimme pro Person.', p:'Für dich selbst stimmen gilt nicht. Niemand sieht Zwischenstände.',
     art:'<div class="ob-lock">&#127876;<div class="ob-ring"></div><div class="ob-ring r2"></div></div>'}
  ];
  const sl = slides[S.ob], last = S.ob === slides.length-1;
  return '<div class="step onb" data-ob="'+S.ob+'">'+
    '<div class="ob-art">'+sl.art+'</div>'+
    '<div class="kicker">'+sl.k+'</div><h2>'+sl.h+'</h2><p class="lead">'+sl.p+'</p>'+
    '<div class="dots">'+slides.map((_,i)=>'<button type="button" data-act="dot" data-k="'+i+'" class="'+(i===S.ob?'on':'')+'" aria-label="Seite '+(i+1)+'"></button>').join('')+'</div>'+
    '<div class="nav"><button type="button" class="ghost" data-act="'+(S.ob===0?'obskip':'obback')+'">'+(S.ob===0?'Überspringen':'Zurück')+'</button>'+
    '<button type="button" class="btn" data-act="obnext">'+(last?'Los geht’s':'Weiter')+'</button></div></div>';
}
function voterHTML(){
  return '<div class="step"><div class="kicker">Schritt 1 von 2</div><h2>Wer bist du?</h2>'+
    '<p class="lead">Name oder Spitzname. Jeder Name kann nur einmal abstimmen.</p>'+
    '<div class="field"><label for="fIn">Dein Name</label><input type="text" id="fIn" maxlength="60" autocomplete="off" autocapitalize="words" value="'+esc(S.voter)+'"></div>'+
    '<p class="msg" role="alert">'+esc(S.err)+'</p>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button><button type="button" class="btn" data-act="next">Weiter</button></div></div>';
}
function pickHTML(){
  return '<div class="step"><div class="kicker">Schritt 2 von 2</div><h2>Wer hat das beste Outfit?</h2>'+
    '<p class="lead">Name oder Spitzname. Spieler, Partnerin, Gast: Jeder darf gewählt werden.</p>'+
    '<div class="field"><label for="fIn">Bestes Outfit</label><input type="text" id="fIn" maxlength="60" autocomplete="off" autocapitalize="words" value="'+esc(S.pick)+'"></div>'+
    '<p class="msg" role="alert">'+esc(S.err)+'</p>'+
    '<div class="nav"><button type="button" class="ghost" data-act="back">Zurück</button><button type="button" class="btn" data-act="send"'+(S.busy?' disabled':'')+'>'+(S.busy?'Sende …':'Abschicken')+'</button></div></div>';
}
function doneHTML(){
  const v = JSON.parse(store.get('sw_voted')||'null') || {voter:S.voter, pick:S.pick};
  return '<div class="step center"><div class="thx">&#127877;</div>'+
    '<div class="kicker">Stimme gezählt</div><h2>Danke, '+esc(v.voter.split(' ')[0])+'!</h2>'+
    '<div class="card"><small>Deine Stimme</small><b>'+esc(v.pick)+'</b></div>'+
    '<p class="lead">Der Gewinner der Verzehrkarte wird heute Abend verkündet. Frohe Weihnachten!</p>'+
    (LIVE ? '' : '<button type="button" class="ghost" data-act="reset">Demo: nochmal abstimmen</button>')+
  '</div>';
}

function render(){
  if (store.get('sw_voted') && S.i < 4) S.i = 4;
  const st = steps[S.i];
  $('top').dataset.hide = (st==='intro' || st==='done') ? '1' : '0';
  $('barI').style.width = ({onb:15, voter:45, pick:80, done:100}[st]||0) + '%';
  $('stage').innerHTML = {intro:introHTML, onb:onbHTML, voter:voterHTML, pick:pickHTML, done:doneHTML}[st]();
  const inp = $('fIn');
  if (inp){
    inp.addEventListener('input', () => {
      if (st==='voter') S.voter = inp.value; else S.pick = inp.value;
    });
    inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); act(st==='pick'?'send':'next'); } });
    if (matchMedia('(pointer:fine)').matches) inp.focus();
  }
  window.scrollTo(0,0);
}
function go(i){ S.err=''; S.i=i; render(); }

async function act(a, el){
  const st = steps[S.i];
  if (a==='next'){
    if (st==='voter'){
      S.voter = clean(S.voter);
      if (S.voter.length < 2){ S.err = MSG.name_missing; return render(); }
    }
    return go(S.i+1);
  }
  if (a==='back') return go(S.i-1);
  if (a==='obnext'){ if (S.ob < 2){ S.ob++; return render(); } return go(S.i+1); }
  if (a==='obback'){ S.ob--; return render(); }
  if (a==='obskip') return go(S.i+1);
  if (a==='dot'){ S.ob = +el.dataset.k; return render(); }
  if (a==='send'){
    if (S.busy) return;
    S.pick = clean(S.pick);
    if (S.pick.length < 2){ S.err = MSG.pick_missing; return render(); }
    if (fold(S.pick) === fold(S.voter)){ S.err = MSG.self_vote; return render(); }
    S.busy = true; S.err = ''; render();
    try {
      await api.submit(S.voter, S.pick);
      store.set('sw_voted', JSON.stringify({voter:S.voter, pick:S.pick}));
      S.busy = false; go(4); confetti(3000);
    } catch(e){
      S.busy = false; S.err = e.message;
      if (e.message === MSG.already_voted){ S.i = 2; }
      render();
    }
    return;
  }
  if (a==='reset'){ store.del('sw_voted'); S.voter=''; S.pick=''; S.ob=0; return go(0); }
}
$('stage').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b); });

/* ---------- Admin ---------- */
const A = {pw:'', data:[], timer:null, auto:true, merge:JSON.parse(store.get('sw_merge')||'{}')};
const ov = $('overlay');
function openAdmin(){
  ov.hidden = false; document.body.style.overflow = 'hidden';
  if (A.pw) return loadAdmin();
  ov.innerHTML = '<div class="sheet"><div class="row"><h3>Admin</h3><button type="button" class="ghost" data-a="close">Schließen</button></div>'+
    '<p class="small">Gleiches Passwort wie bei der Bierlon\'Dor-Abstimmung.'+(LIVE?'':' Demo-Modus: Passwort „demo“.')+'</p>'+
    '<div class="field"><label for="aPw">Passwort</label><input type="password" id="aPw" autocomplete="current-password"></div>'+
    '<p class="msg" id="aMsg" role="alert"></p><button type="button" class="btn full" data-a="login">Öffnen</button></div>';
  const p = $('aPw'); p.focus(); p.addEventListener('keydown', e => { if (e.key==='Enter') adminAct('login'); });
}
function closeAdmin(){ ov.hidden = true; ov.innerHTML = ''; document.body.style.overflow = ''; clearInterval(A.timer); A.timer = null; }
async function loadAdmin(silent){
  try { A.data = await api.results(A.pw) || []; }
  catch(e){ if (!silent){ if (e.message === MSG.wrong_password) A.pw = ''; const m = $('aMsg'); if (m) m.textContent = e.message; else alert(e.message); } return; }
  drawAdmin();
  clearInterval(A.timer); if (A.auto) A.timer = setInterval(() => loadAdmin(true), 10000);
}
function ranking(){
  // Schreibweisen zusammenfassen: gleiche Schreibweise ohne Groß/klein, Umlaute, Leerzeichen
  const g = {};
  for (const v of A.data){
    let k = fold(v.pick); if (A.merge[k]) k = A.merge[k];
    (g[k] = g[k] || {k, n:0, sp:{}}).n++;
    g[k].sp[v.pick] = (g[k].sp[v.pick]||0) + 1;
  }
  return Object.values(g).map(x => {
    const sp = Object.entries(x.sp).sort((a,b) => b[1]-a[1]);
    return {k:x.k, n:x.n, name:sp[0][0], variants:sp.map(s => s[0])};
  }).sort((a,b) => b.n-a.n || a.name.localeCompare(b.name,'de'));
}
function drawAdmin(){
  const R = ranking(), tot = A.data.length, max = R[0] ? R[0].n : 0;
  const win = R.filter(r => r.n === max && max > 0);
  let rank = 0, prev = -1;
  const rows = R.map((r,i) => { if (r.n !== prev){ rank = i+1; prev = r.n; }
    const opts = '<option value="">Gehört zu …</option>'+R.filter(o => o.k !== r.k).map(o => '<option value="'+esc(o.k)+'">'+esc(o.name)+'</option>').join('');
    return '<div class="rk"><span class="n">'+rank+'.</span><span class="nm">'+esc(r.name)+'</span><span class="ct">'+r.n+' · '+Math.round(r.n/tot*100)+' %</span>'+
      '<div class="b"><i style="width:'+(r.n/max*100)+'%"></i></div>'+
      (r.variants.length > 1 ? '<span class="var">Schreibweisen: '+r.variants.map(esc).join(', ')+'</span>' : '')+
      (R.length > 1 ? '<select data-merge="'+esc(r.k)+'" aria-label="'+esc(r.name)+' zusammenführen mit">'+opts+'</select>' : '')+
    '</div>'; }).join('');
  const merged = Object.keys(A.merge).length;
  const fmt = t => new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  ov.innerHTML = '<div class="sheet wide">'+
    '<div class="row"><h3>Auswertung</h3><button type="button" class="ghost" data-a="close">Schließen</button></div>'+
    '<div class="stat"><div><b>'+tot+'</b><small>Stimmen</small></div><div><b>'+R.length+'</b><small>Gewählte</small></div><div><b>'+max+'</b><small>Höchstwert</small></div></div>'+
    '<label class="tog"><input type="checkbox" id="aAuto"'+(A.auto?' checked':'')+'> Alle 10 Sekunden aktualisieren</label>'+
    '<div class="res win"><h4>Gewinner</h4>'+(win.length ? '<div class="wbig">'+win.map(w => esc(w.name)).join(' &amp; ')+'</div><p class="small">'+max+' von '+tot+' Stimmen</p>'+(win.length>1?'<p class="tie">Gleichstand! Stichwahl oder Los entscheiden.</p>':'') : '<p class="small">Noch keine Stimmen.</p>')+'</div>'+
    '<div class="btnrow"><button type="button" class="btn" data-a="reveal"'+(win.length?'':' disabled')+'>Gewinner groß zeigen</button><button type="button" class="btn sec" data-a="refresh">Aktualisieren</button></div>'+
    '<div class="res"><h4>Rangliste</h4>'+(rows || '<p class="small">Noch keine Stimmen.</p>')+
      '<p class="small" style="margin-top:8px">Gleiche Person unterschiedlich geschrieben? Über „Gehört zu …“ zusammenführen.'+(merged?' <button type="button" class="ghost" data-a="unmerge" style="padding:0;font-size:13px;color:var(--gold)">Zusammenführungen aufheben ('+merged+')</button>':'')+'</p></div>'+
    '<div class="btnrow"><button type="button" class="btn sec" data-a="copy">Ergebnis kopieren</button><button type="button" class="btn sec" data-a="csv">Als CSV laden</button></div>'+
    '<div class="res"><h4>Alle Stimmen</h4><div class="tbox"><table><thead><tr><th>Zeit</th><th>Von</th><th>Für</th><th></th></tr></thead><tbody>'+
      A.data.map(v => '<tr><td class="t">'+fmt(v.ts)+'</td><td>'+esc(v.voter)+'</td><td>'+esc(v.pick)+'</td><td><button type="button" class="del" data-a="del" data-id="'+esc(v.id)+'">Löschen</button></td></tr>').join('')+
    '</tbody></table></div></div>'+
    '<button type="button" class="ghost" data-a="logout">Abmelden</button>'+
  '</div>';
  $('aAuto').onchange = e => { A.auto = e.target.checked; clearInterval(A.timer); if (A.auto) A.timer = setInterval(() => loadAdmin(true), 10000); };
  ov.querySelectorAll('select[data-merge]').forEach(s => s.onchange = () => {
    if (!s.value) return;
    const from = s.dataset.merge, to = s.value;
    for (const k in A.merge) if (A.merge[k] === from) A.merge[k] = to;
    A.merge[from] = to; store.set('sw_merge', JSON.stringify(A.merge)); drawAdmin();
  });
}
function resultText(){
  const R = ranking(); let rank = 0, prev = -1;
  return 'Bester Weihnachtssweater '+CONFIG.year+' ('+A.data.length+' Stimmen)\n'+R.map((r,i) => { if (r.n!==prev){ rank=i+1; prev=r.n; } return rank+'. '+r.name+': '+r.n; }).join('\n');
}
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function showReveal(){
  const R = ranking(); const max = R[0].n; const win = R.filter(r => r.n === max);
  const el = document.createElement('div'); el.className = 'reveal';
  el.innerHTML = '<div class="k">Bester Weihnachtssweater '+CONFIG.year+'</div><div class="sus">…</div><div class="x">Klicken oder Taste drücken</div>';
  document.body.appendChild(el);
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch(e){}
  let stage = 0;
  const next = () => {
    if (stage === 0){
      stage = 1;
      el.innerHTML = '<div class="k">Bester Weihnachtssweater '+CONFIG.year+'</div><div class="w">'+win.map(w => esc(w.name)).join('<br>&amp; ')+'</div><div class="s">'+max+' von '+A.data.length+' Stimmen · Gewinnt eine Verzehrkarte</div><div class="x">Klicken zum Schließen</div>';
      confetti(6000);
    } else { el.remove(); removeEventListener('keydown', key); try { document.fullscreenElement && document.exitFullscreen(); } catch(e){} }
  };
  const key = e => { if (e.key === 'Escape'){ stage = 1; } next(); };
  el.addEventListener('click', next); addEventListener('keydown', key);
}
async function adminAct(a, el){
  if (a==='close') return closeAdmin();
  if (a==='login'){
    A.pw = $('aPw').value; if (!A.pw) return;
    const b = ov.querySelector('[data-a=login]'); b.disabled = true; b.textContent = 'Prüfe …';
    await loadAdmin(); if (!A.pw){ b.disabled = false; b.textContent = 'Öffnen'; }
    return;
  }
  if (a==='refresh') return loadAdmin();
  if (a==='logout'){ A.pw = ''; closeAdmin(); return; }
  if (a==='unmerge'){ A.merge = {}; store.del('sw_merge'); return drawAdmin(); }
  if (a==='reveal') return showReveal();
  if (a==='copy'){ const t = resultText(); try { await navigator.clipboard.writeText(t); el.textContent = 'Kopiert ✓'; } catch(e){ prompt('Kopieren:', t); } return; }
  if (a==='csv'){
    const q = s => '"'+String(s).replace(/"/g,'""')+'"';
    const R = ranking(); let rank = 0, prev = -1;
    const lines = ['Bester Weihnachtssweater '+CONFIG.year, 'Stimmen gesamt;'+A.data.length, '', 'Platz;Name;Stimmen;Anteil;Schreibweisen'];
    R.forEach((r,i) => { if (r.n!==prev){ rank=i+1; prev=r.n; } lines.push([rank, q(r.name), r.n, (r.n/A.data.length*100).toFixed(1).replace('.',',')+' %', q(r.variants.join(', '))].join(';')); });
    lines.push('', 'Einzelstimmen', 'Zeit;Von;Für');
    A.data.slice().reverse().forEach(v => lines.push([new Date(v.ts).toLocaleString('de-DE'), q(v.voter), q(v.pick)].join(';')));
    return download('weihnachtssweater-auswertung.csv', '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  }
  if (a==='del'){
    const v = A.data.find(x => String(x.id) === el.dataset.id);
    if (!v || !confirm('Stimme von '+v.voter+' für '+v.pick+' löschen?')) return;
    try { await api.remove(A.pw, v.id); } catch(e){ return alert(e.message); }
    return loadAdmin();
  }
}
ov.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b) adminAct(b.dataset.a, b); else if (e.target === ov) closeAdmin(); });
$('gear').onclick = openAdmin;
addEventListener('keydown', e => { if (e.key==='Escape' && !ov.hidden && !document.querySelector('.reveal')) closeAdmin(); });

render();
</script>
